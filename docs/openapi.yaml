      description: Sensor ativo deve pertencer ao lote autorizado. Escolha só colheita, exportação com cotação
        manual, ou exportação por dois IDs distintos. IDs exigem cotações da cultura do lote, BRL/KG, destinos
        interno/exportação e até 7 dias. Não misture IDs com valores diretos de cotação. Parâmetros precisam
        de validação agronômica.
