openapi: 3.0.3
info:
  title: ValeSafra — API
  version: 1.0.0
  description: 'Documentação da API do ValeSafra, plataforma de monitoramento climático, produção agrícola, mercado
    e logística. Os endpoints protegidos utilizam JWT no cabeçalho Authorization: Bearer.'
servers:
- url: http://localhost:3000/api
  description: Ambiente local
- url: https://SEU_BACKEND_PUBLICADO/api
  description: Ambiente publicado — substituir pela URL real
tags:
- name: Sistema
- name: Autenticação
- name: Usuários
- name: Culturas
- name: Propriedades
- name: Lotes
- name: Sensores
- name: Leituras
- name: Alertas
- name: Dashboard
- name: Logística
- name: Mercado
- name: Cotações de mercado
- name: Recomendações
paths:
  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Realizar login
      description: Autenticação pública. O endpoint aplica limite de tentativas.
      responses:
        '200':
          description: Operação realizada com sucesso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - senha
              properties:
                email:
                  type: string
                  format: email
                  example: produtor@exemplo.com
                senha:
                  type: string
                  format: password
                  example: Senha123
  /auth/me:
    get:
      tags:
      - Autenticação
      summary: Consultar usuário autenticado
      description: Consultar usuário autenticado
      responses:
        '200':
          description: Operação realizada com sucesso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'
      security:
      - bearerAuth: []
  /auth/logout:
    post:
      tags:
      - Autenticação
      summary: Encerrar sessão no cliente
      description: O token é stateless; o cliente deve descartar o token.
      responses:
        '204':
          description: Operação realizada com sucesso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'
      security:
      - bearerAuth: []
  /health:
    get:
      tags:
      - Sistema
      summary: Verificar disponibilidade
      description: Endpoint público de health check.
      responses:
        '200':
          description: Operação realizada com sucesso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
