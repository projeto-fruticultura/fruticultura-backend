openapi: 3.0.3
info:
  title: ValeSafra — API
  version: 1.0.0
  description: Documentação alinhada à main 5269209. Use JWT em Authorize para rotas protegidas. ADMIN possui
    escopo global; PRODUTOR acessa propriedades próprias; TECNICO acessa propriedades vinculadas. Recursos
    fora do escopo podem retornar 404. IDs dos exemplos precisam existir no ambiente. Credenciais dos exemplos
    são fictícias. Corpo JSON limitado a 100kb.
servers:
  - url: /api
    description: Mesmo servidor da documentação — recomendado
  - url: http://localhost:3000/api
    description: Desenvolvimento local
  - url: https://d2nmqrbqvtvva2.cloudfront.net/api
    description: API AWS indicada no README da main
tags:
  - name: Sistema
  - name: Autenticação
  - name: Usuários
  - name: Culturas
  - name: Propriedades
  - name: Lotes
  - name: Sensores
  - name: Leituras
  - name: Alertas
  - name: Dashboard
  - name: Logística
  - name: Mercado
  - name: Cotações de mercado
  - name: Recomendações
  - name: Produtividade
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Realizar login
      operationId: postAuthLogin
      tags:
        - Autenticação
      description: Público, sem JWT. Até 10 falhas por IP a cada 15 minutos; sucessos não contam. Conta inativa
        retorna 401.
      security: []
      x-perfis-autorizados: []
      parameters: []
      responses:
        "200":
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResposta"
        "400":
          description: Dados ou parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "401":
          description: Token ausente, inválido ou expirado; conta inativa. No login, credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "413":
          description: Corpo JSON excede 100kb.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "415":
          description: Codificação do corpo não suportada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "429":
          description: Limite de consultas atingido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "500":
          description: Erro interno inesperado, sem stack trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginEntrada"
  /auth/me:
    get:
      summary: Consultar usuário autenticado
      operationId: getAuthMe
      tags:
        - Autenticação
      description: "Perfis: ADMIN, TECNICO, PRODUTOR. Escopo aplicado no backend."
      security:
        - bearerAuth: []
      x-perfis-autorizados:
        - ADMIN
        - TECNICO
        - PRODUTOR
      parameters: []
      responses:
        "200":
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: "#/components/schemas/Usuario"
                required:
                  - usuario
        "401":
          description: Token ausente, inválido ou expirado; conta inativa. No login, credenciais inválidas.
