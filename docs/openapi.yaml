components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Informe somente o JWT. O prefixo Bearer é aplicado automaticamente.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico do recurso.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        campos:
          type: object
          additionalProperties:
            type: string
        totalSensores:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - erro
      description: Erros esperados não retornam stack trace ou segredos. X-Request-Id identifica a requisição.
    Paginacao:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
          maximum: 2147483647
        limite:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 2147483647
        totalPaginas:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - pagina
        - limite
        - total
        - totalPaginas
    Usuario:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          type: string
          enum:
            - ADMIN
            - PRODUTOR
            - TECNICO
        status:
          type: string
          enum:
            - ATIVO
            - INATIVO
      required:
        - id
        - nome
        - email
        - perfil
        - status
    LoginEntrada:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        senha:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: Até 72 bytes UTF-8; espaços são preservados.
      required:
        - email
        - senha
      example:
        email: produtor@example.com
        senha: SenhaExemplo123
    LoginResposta:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"
      required:
        - token
        - usuario
    UsuarioCriar:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        perfil:
          type: string
          enum:
            - ADMIN
            - PRODUTOR
            - TECNICO
        senha:
          type: string
          format: password
          writeOnly: true
          description: "Obrigatória no cadastro: 8 a 72 bytes UTF-8."
      required:
        - nome
        - email
        - senha
        - perfil
      example:
        nome: Produtor de exemplo
        email: produtor@example.com
        perfil: PRODUTOR
        senha: SenhaExemplo123
    UsuarioAtualizar:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        perfil:
          type: string
          enum:
            - ADMIN
            - PRODUTOR
            - TECNICO
        status:
          type: string
          enum:
            - ATIVO
          description: Somente reativação. Use DELETE para inativar. senha é ignorada neste PUT.
      description: PUT parcial. ADMIN não pode alterar o próprio perfil. Campos desconhecidos são ignorados.
      example:
        status: ATIVO
    VinculosEntrada:
      type: object
      properties:
        propriedadeIds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2147483647
      required:
        - propriedadeIds
      description: Substitui todos os vínculos do técnico. Lista vazia desvincula tudo. Até 100 IDs distintos;
        duplicatas são eliminadas pelo servidor.
      example:
        propriedadeIds:
          - 1
          - 2
    CulturaEntrada:
      type: object
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 100
        variedade:
          type: string
          maxLength: 100
          nullable: true
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        temperaturaMin:
          type: number
          minimum: -50
          maximum: 60
          multipleOf: 0.01
        temperaturaMax:
          type: number
          minimum: -50
          maximum: 60
          multipleOf: 0.01
        umidadeMin:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
        umidadeMax:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
      required:
        - nome
        - temperaturaMin
        - temperaturaMax
        - umidadeMin
        - umidadeMax
      description: POST e PUT exigem os campos obrigatórios. Mínimos não podem superar máximos. Texto opcional vazio
        vira null.
