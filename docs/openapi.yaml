components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Informe somente o token JWT. O prefixo Bearer é aplicado automaticamente.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico do recurso.
      schema:
        type: integer
        minimum: 1
  responses:
    ErroValidacao:
      description: Dados ou parâmetros inválidos.
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
    SemPermissao:
      description: Perfil sem autorização para esta operação.
    ErroInterno:
      description: Erro interno inesperado.
